<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Caption — Week 6</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/form.css">
</head>
<body>

    <div class="container">
        <!-- Navigasi Halaman dengan aria-current -->
        <nav class="nav-links">
            <a href="index.html">Etalase Produk</a>
            <a href="form.html" aria-current="page" class="active">Generator Caption</a>
        </nav>

        <header>
            <h1>Caption Produk</h1>
            <p>Generator caption produk untuk media sosial.</p>
        </header>

        <div class="form-card">
            <form id="captionForm" novalidate>
                <div class="form-group">
                    <label for="productName">Nama Produk</label>
                    <input type="text" id="productName" placeholder="Contoh: Kopi Susu Aren">
                    <span id="nameError" class="field-error"></span>
                </div>

                <div class="form-group">
                    <label for="productPrice">Harga (Rp)</label>
                    <input type="number" id="productPrice" placeholder="Contoh: 18000">
                    <span id="priceError" class="field-error"></span>
                </div>

                <div class="form-group">
                    <label for="templateChoice">Pilih Template</label>
                    <select id="templateChoice">
                        <option value="promo">Promo</option>
                        <option value="santai">Santai</option>
                        <option value="formal">Formal</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Buat Caption</button>
            </form>

            <!-- Hasil Output Caption Dinamis -->
            <div id="resultSection" class="caption-result hidden">
                <h3>Hasil Caption:</h3>
                <div id="captionOutput" class="caption-box"></div>
            </div>
        </div>
    </div>

    <script src="js/form.js"></script>
</body>
</html>
